name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-ci
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    uses: shani8dev/shani-ci-commons/.github/workflows/lint.yml@main
    with:
      language: bash

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y -qq jq

      - name: Run deploy-state tests
        run: bash tests/test-deploy-state.sh

      - name: Run status-json contract tests
        run: bash tests/test-status-json.sh

      - name: Run upgrade-adviser tests
        run: bash tests/test_upgrade_adviser.sh

      - name: Run sysctl-verify contract tests
        run: bash tests/test-sysctl-verify.sh

      - name: Run TPM2 PCR policy contract tests
        run: bash tests/test-tpm2-pcr-policy.sh

      - name: Run TPM2 pcrlock enrollment contract tests
        run: bash tests/test-tpm2-pcrlock.sh

      - name: Run TPM2 pcrlock status contract tests
        run: bash tests/test-tpm2-pcrlock-status.sh

      - name: Run TPM2 pcrlock health contract tests
        run: bash tests/test-tpm2-pcrlock-health.sh

      - name: Run runtime-only units contract tests
        run: bash tests/test-runtime-only-units.sh

  unit-files:
    name: Unit files (systemd-analyze verify)
    runs-on: ubuntu-latest
    needs: lint
    # Real Arch systemd, not the runner's Ubuntu one — the same systemd the
    # image ships.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unit dependencies
        run: pacman -Sy --noconfirm --needed flatpak

      - name: Verify units
        run: bash tests/verify-units.sh .

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: lint