# shani.conf — Centralized INI config for shani-deploy
# Layout:
#   /etc/shani/shani.conf  (system-wide — installed by package)
#   ~/.config/shani/shani.conf  (user override — lower priority than CLI/env)
#
# Variables are referenced as section_key (e.g. deploy_channel).
# Scripts use ${var:-${DEFAULT_var}} fallbacks for every config value.

# ── Deploy ────────────────────────────────────────────────────────────────
[deploy]
# Update channel: stable | latest
channel=stable

# Slot marker paths (relative to /data or /run)
current_slot=/data/current-slot
prev_slot=/data/previous-slot
boot_failure=/data/boot_failure
boot_hard_failure=/data/boot_hard_failure
boot_ok=/data/boot-ok
boot_in_progress=/data/boot_in_progress
pending=/data/deployment_pending
reboot_needed=/run/shanios/reboot-needed

# Download/cache
download_dir=/data/downloads
mirror_cache=/data/downloads/mirror.url

# Download URLs
r2_base_url=https://downloads.shani.dev
sourceforge_base=https://sourceforge.net/projects/shanios/files

# Timeouts (seconds)
network_timeout=30
max_download_attempts=5
extraction_timeout=1800
curl_retries=3
curl_retry_delay=5

# Resource thresholds
min_free_space_mb=10240
min_file_size=10485760

# Paths
mount_dir=/mnt
esp_path=/boot/efi
genefi_script=/usr/local/bin/gen-efi
genefi_script_url=https://raw.githubusercontent.com/shani8dev/shani-deploy/refs/heads/main/scripts/gen-efi.sh
log_file=/var/log/shanios-deploy.log
lock_file=/run/shanios-deploy.lock
channel_file=/etc/shani-channel
license_file=/etc/shani-license
rootlabel=shani_root
max_inhibit_depth=2

# GPG
gpg_key_id=7B927BFFD4A9EAAA8B666B77DE217F3DA8014792

# ── Health ────────────────────────────────────────────────────────────────
[health]
# Diagnostic modes (comma-separated, order = default report order)
diagnostic_modes=info,security,boot,network,hardware,packages,verify,history,storage-info,journal,clean-logs,export-logs

# Structured output formats (comma-separated)
output_formats=json,nagios,prometheus

# Health log file (shared with deploy log)
log_file=/var/log/shanios-deploy.log

# Channel file (shared with deploy)
channel_file=/etc/shani-channel

# GPG signing key
gpg_signing_key=7B927BFFD4A9EAAA8B666B77DE217F3DA8014792
gpg_signing_key_file=/etc/shani-keys/signing.asc

# (The [update] section belonged to shani-update, retired 2026-09-25: update
#  and boot-failure notifications now come from Shani Cassini's user timer.)
