# ShaniOS blesses a boot with its own bless-boot.service, which runs only
# after mark-boot-success.service has written /data/boot-ok (and, on a trial
# boot, after shani-desktop-health.service). systemd-bless-boot-generator's
# copy of this unit waits only for boot-complete.target, which ShaniOS does
# not gate, so it would mark every counted boot good right after sysinit -
# before anything proved the slot works. It steps aside while ShaniOS's unit
# is installed.
[Unit]
ConditionPathExists=!/usr/lib/systemd/system/bless-boot.service
